  #     DATABASE_URL: postgres://admin:MR1F3EyzIMwSQbRj7RNRYqyBPJnXte11vpkVPeCp@db:5432/ecomapdb
  #     # más variables aquí si lo necesitas
  #   ports:
  #     - "3000:3000"
