version: '3.8'
services:
  db:
    image: postgres:15
    container_name: ecomap-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: MR1F3EyzIMwSQbRj7RNRYqyBPJnXte11vpkVPeCp
      POSTGRES_USER: admin
      POSTGRES_DB: ecomapdb
    ports:
      - '5432:5432'
    volumes:
      - ./ecomap_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d ecomapdb']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  adminer:
    image: adminer
    restart: always
    ports:
      - '8080:8080'

  # Descomentar i configurar quan afegim els contenidors per backend i Redis
  # backend:
