  #     - db

  # redis:
  #   image: redis:7
  #   container_name: ecomap-redis
  #   restart: always
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

volumes:
  ecomap_data:
    driver: local
