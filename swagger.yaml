      description: Elimina un mensaje propio si tiene menos de 5 minutos de antigüedad (soft delete).
      tags: [Chat]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
