openapi: 3.0.0
info:
  title: PESkaos API
  description: API para la aplicación EcoMap.
  version: 1.0.0
  contact:
    name: Equipo Backend PESkaos
servers:
  - url: http://localhost:3001
    description: Servidor de desarrollo local
  - url: https://tu-url-produccion.railway.app
    description: Servidor de producción (Railway)

components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de identidad obtenido directamente de Firebase (usar solo en /sync).
    backendAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT generado por este backend tras la sincronización.
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Clave de API para servicios externos.

  schemas:
    # Basado en el modelo 'registered_user' y 'client' de Prisma
    UserProfile:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        surname:
          type: string
        username:
          type: string
        dni:
          type: string
        profile_picture:
          type: string
          nullable: true
        app_language:
          type: string
          enum: [ca, es, en]
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
          nullable: true
        role:
          type: string
          enum: [client, admin, institution]
        points:
          type: integer
        streak:
          type: integer

    # Basado en el modelo 'recycling_point' de Prisma
    RecyclingPoint:
      type: object
      properties:
        recycling_point_id:
          type: string
          format: uuid
        api_id:
          type: integer
        api_location:
          type: string
          enum: [Navarra, Barcelona]
        name:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        equipment_type:
          type: string
          description: Mapeado desde el enum equipment_type de la BD
        distance_km:
          type: number
          description: Distancia en KM desde el punto de búsqueda. **Solo presente** si se aplica el filtro de proximidad (lat+lng+radius).
        timetable:
          type: array
          items:
            type: object
            properties:
              open_time:
                type: string
              end_time:
                type: string

    # Respuesta estándar de la API
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        code:
          type: string
          description: Código de error interno (ej. USER_NOT_FOUND)

    PublicationMedia:
      type: object
      properties:
        media_id:
          type: string
          format: uuid
        media_url:
          type: string
        publication_id:
          type: string
          format: uuid

    DetectionItem:
      type: object
      properties:
        class:
          type: integer
        class_name:
          type: string
        confidence:
          type: number
          format: float
        bbox:
          type: array
          items:
            type: number
            format: float

    BikeDetectionResponse:
      type: object
      properties:
        hasBike:
          type: boolean
        confidence:
          type: number
          format: float
          nullable: true
        count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/DetectionItem'

    WasteDetectionResponse:
      type: object
      properties:
        hasWaste:
          type: boolean
        confidence:
          type: number
          format: float
          nullable: true
        count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/DetectionItem'

    TradeDetails:
      type: object
      properties:
        trade_id:
          type: string
          format: uuid
        publication_id:
          type: string
          format: uuid
        item_state:
          type: string
          enum: [New, Little_used, Widely_used, Bad_condition]
        points_price:
          type: integer
        created_at:
          type: string
          format: date-time

    RewardDetails:
      type: object
      properties:
        publication_id:
          type: string
          format: uuid
        content:
          type: string
        points_price:
          type: integer
        available:
          type: boolean

    Publication:
      type: object
      properties:
        publication_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
        publication_state:
          type: string
          enum: [Pending, Completed, Cancelled]
        client_id:
          type: string
          nullable: true
        institution_id:
          type: string
          nullable: true
        trade:
          $ref: '#/components/schemas/TradeDetails'
          nullable: true
        reward:
          $ref: '#/components/schemas/RewardDetails'
          nullable: true
        publication_media:
          type: array
          items:
            $ref: '#/components/schemas/PublicationMedia'

    # --- Chat Schemas ---
    Chat:
      type: object
      properties:
        chat_id:
          type: string
          format: uuid
        other_user:
          type: object
          properties:
            name:
              type: string
            surname:
              type: string
            profile_picture:
              type: string
        last_message:
          type: object
          properties:
            content:
              type: string
            created_at:
              type: string
              format: date-time
        unread_count:
          type: integer
        updated_at:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid
        content:
          type: string
        is_read:
          type: boolean
        delivered:
          type: boolean
        created_at:
          type: string
          format: date-time
        is_deleted:
          type: boolean

    Reservation:
      type: object
      properties:
        reservation_id:
          type: string
          format: uuid
        trade_id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        reservation_date:
          type: string
          format: date-time
        confirmed:
          type: boolean
        trade:
          $ref: '#/components/schemas/TradeDetails'
        client:
          $ref: '#/components/schemas/UserProfile'

    ReservationEnded:
      type: object
      properties:
        reservation_id:
          type: string
          format: uuid
        ended_at:
          type: string
          format: date-time
        reservation:
          $ref: '#/components/schemas/Reservation'

paths:
  # --- Health Check ---
  /:
    get:
      summary: Verificar estado del servidor
      tags: [General]
      responses:
        '200':
          description: API running
          content:
            text/plain:
              schema:
                type: string
                example: API running.

  # --- Usuarios ---
  /api/users/sync:
    post:
      summary: Sincronizar usuario / Login / Registro
      description: Intercambia un token de Firebase por un JWT del Backend y crea el usuario si no existe.
      tags: [Usuarios]
      security:
        - firebaseAuth: []
      requestBody:
        description: Datos opcionales para registro manual.
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                username:
                  type: string
      responses:
        '200':
          description: Login correcto o usuario creado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      jwt:
                        type: string
                        description: JWT del Backend para futuras peticiones.
                      expiryDate:
                        type: string
                        format: date-time

  /api/users/me:
    get:
      summary: Obtener perfil del usuario actual
      tags: [Usuarios]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Perfil obtenido correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
    put:
      summary: Actualizar perfil del usuario
      tags: [Usuarios]
      security:
        - backendAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                surname:
                  type: string
                username:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                  example: '+34 612345678'
                birth_date:
                  type: string
                  format: date
                  example: '1990-01-01'
                description:
                  type: string
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
    delete:
      summary: Eliminar cuenta de usuario
      description: Requiere autenticación reciente (< 5 min).
      tags: [Usuarios]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Cuenta eliminada.

  /api/users/logout:
    post:
      summary: Cerrar sesión
      description: Invalida el JWT del backend en la base de datos.
      tags: [Usuarios]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Sesión cerrada correctamente.

  /api/users/language:
    put:
      summary: Cambiar idioma de la aplicación
      tags: [Usuarios]
      security:
        - backendAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newLanguage:
                  type: string
                  enum: [ca, es, en]
      responses:
        '200':
          description: Idioma actualizado.

  # --- Puntos de Reciclaje ---
  /api/recycling-points/{region}:
    get:
      summary: Obtener puntos de reciclaje por región
      description: Soporta filtros por proximidad, tipo, horario, etc. Usa cache SWR.
      tags: [Puntos de Reciclaje]
      parameters:
        - in: path
          name: region
          required: true
          schema:
            type: string
            enum: [navarra, barcelona]
        # Filtros extraídos de recycling-points.controller.js
        - in: query
          name: api_id
          schema:
            type: integer
          description: Filtrar por ID original de la API externa.
        - in: query
          name: equipment_type
          schema:
            type: string
            # Enum extraído de schema.prisma y equipment-type-mapper.js
            enum:
              [
                Recycling_center,
                Batteries,
                Medicines_and_packaging,
                Garden_waste,
                Clothing_and_footwear,
                Bulky_waste,
                Glass_containers,
                Coffee_capsules,
                Used_cooking_oil,
                Household_construction_waste,
                Community_composting,
              ]
        - in: query
          name: wasteType
          schema:
            type: string
            enum: [ElectricContainer, GlassContainer, OrganicContainer, PaperContainer, PlasticContainer, TextileContainer, Unrecyclable]
          description: Filtra puntos que tengan contenedores de este tipo.
        - in: query
          name: name
          schema:
            type: string
          description: Búsqueda parcial por nombre.

        # --- FILTROS DE PROXIMIDAD (INTERDEPENDIENTES) ---
        - in: query
          name: lat
          schema:
            type: number
            format: float
          description: 'Latitud del centro de búsqueda. **Requerido para filtro de proximidad** (debe usarse junto con `lng` y `radius`). Si falta alguno de los tres, se ignora este filtro.'
        - in: query
          name: lng
          schema:
            type: number
            format: float
          description: 'Longitud del centro de búsqueda. **Requerido para filtro de proximidad** (debe usarse junto con `lat` y `radius`). Si falta alguno de los tres, se ignora este filtro.'
        - in: query
          name: radius
          schema:
            type: number
            format: float
          description: 'Radio en kilómetros. **Requerido para filtro de proximidad** (debe usarse junto con `lat` y `lng`). Si falta alguno de los tres, se ignora este filtro.'
        # -----------------------------------------------

        - in: query
          name: isOpenNow
          schema:
            type: boolean
          description: Filtrar solo puntos abiertos ahora mismo.
        - in: query
          name: openAt
          schema:
            type: string
            format: date-time
          description: Filtrar puntos abiertos en una fecha específica.
      responses:
        '200':
          description: Lista de puntos de reciclaje.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  totalRegisters:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecyclingPoint'

  /api/recycling-points/{region}/status:
    get:
      summary: Estado del cache (Solo Admin)
      tags: [Puntos de Reciclaje]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: region
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Metadata del cache.

  /api/recycling-points/{region}/refresh:
    post:
      summary: Forzar sincronización (Solo Admin)
      tags: [Puntos de Reciclaje]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: region
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sincronización completada.
        '409':
          description: Sincronización ya en progreso.

  # --- Rutas ---
  /api/routes:
    get:
      summary: Calcular ruta (OpenRouteService)
      tags: [Rutas]
      parameters:
        - in: query
          name: start
          required: true
          schema:
            type: string
            example: '41.3851,2.1734'
          description: Latitud,Longitud de inicio.
        - in: query
          name: end
          required: true
          schema:
            type: string
            example: '41.4036,2.1744'
          description: Latitud,Longitud de destino.
        - in: query
          name: profile
          schema:
            type: string
            default: driving-car
            enum: [driving-car, cycling-regular, foot-walking, wheelchair]
      responses:
        '200':
          description: Datos de la ruta calculada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      distance:
                        type: number
                      duration:
                        type: number
                      geometry:
                        type: array
                        items:
                          type: array # [lng, lat]
                      steps:
                        type: array
                        items:
                          type: object

  # --- Publicaciones (Rewards) ---
  /api/publications/rewards:
    post:
      summary: Crear nueva recompensa (Solo Instituciones)
      tags: [Publicaciones]
      security:
        - backendAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                content:
                  type: string
                pointsPrice:
                  type: integer
                mediaUrl:
                  type: string
      responses:
        '201':
          description: Recompensa creada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Publication'
    get:
      summary: Obtener todas las recompensas
      tags: [Publicaciones]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Lista de recompensas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Publication'

  /api/publications/rewards/institution/{institutionId}:
    get:
      summary: Obtener recompensas de una institución
      tags: [Publicaciones]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: institutionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de recompensas de la institución.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Publication'

  /api/publications/rewards/{id}/availability:
    patch:
      summary: Actualizar disponibilidad de recompensa
      tags: [Publicaciones]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                available:
                  type: boolean
      responses:
        '200':
          description: Disponibilidad actualizada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Publication'

  # --- Publicaciones (Trades) ---
  /api/publications/trades:
    post:
      summary: Crear nuevo intercambio (Solo Clientes)
      tags: [Publicaciones]
      security:
        - backendAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                itemState:
                  type: string
                  enum: [New, Little_used, Widely_used, Bad_condition]
                pointsPrice:
                  type: integer
                mediaUrl:
                  type: string
      responses:
        '201':
          description: Intercambio creado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Publication'
    get:
      summary: Obtener todos los intercambios activos
      tags: [Publicaciones]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Lista de intercambios.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Publication'

  /api/publications/trades/status/completed:
    get:
      summary: Obtener intercambios completados
      tags: [Publicaciones]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Lista de intercambios completados.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Publication'

  /api/publications/trades/status/cancelled:
    get:
      summary: Obtener intercambios cancelados
      tags: [Publicaciones]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Lista de intercambios cancelados.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Publication'

  /api/publications/trades/status/pending:
    get:
      summary: Obtener intercambios pendientes
      tags: [Publicaciones]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Lista de intercambios pendientes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Publication'

  /api/publications/trades/user/{userId}:
    get:
      summary: Obtener intercambios de un usuario
      tags: [Publicaciones]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de intercambios del usuario.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Publication'

  /api/publications/trades/user/{userId}/completed:
    get:
      summary: Obtener intercambios completados de un usuario
      tags: [Publicaciones]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de intercambios completados del usuario.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Publication'

  /api/publications/trades/user/{userId}/cancelled:
    get:
      summary: Obtener intercambios cancelados de un usuario
      tags: [Publicaciones]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de intercambios cancelados del usuario.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Publication'

  /api/publications/trades/user/{userId}/pending:
    get:
      summary: Obtener intercambios pendientes de un usuario
      tags: [Publicaciones]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de intercambios pendientes del usuario.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Publication'

  /api/publications/trades/{id}/state:
    patch:
      summary: Actualizar estado de un intercambio
      tags: [Publicaciones]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum: [Completed, Cancelled, Pending]
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Publication'

  /api/publications/trades/{id}:
    get:
      summary: Obtener detalle de un intercambio
      tags: [Publicaciones]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalle del intercambio.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Publication'

  /api/publications/{id}:
    delete:
      summary: Eliminar publicación (Trade o Reward)
      tags: [Publicaciones]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Publicación eliminada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # --- Chat ---
  /api/chats:
    get:
      summary: Listar chats del usuario
      tags: [Chat]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Lista de chats obtenida correctamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
    post:
      summary: Iniciar o recuperar chat
      description: Crea un nuevo chat con el usuario objetivo (por username) o devuelve el existente.
      tags: [Chat]
      security:
        - backendAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username del usuario con el que se quiere chatear.
      responses:
        '200':
          description: Chat recuperado o creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'

  /api/chats/{chatId}/messages:
    get:
      summary: Obtener historial de mensajes
      tags: [Chat]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
          description: Número de mensajes a recuperar.
        - in: query
          name: before
          schema:
            type: string
            format: uuid
          description: ID del mensaje cursor para paginación (traer mensajes anteriores a este).
      responses:
        '200':
          description: Historial de mensajes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    post:
      summary: Enviar mensaje
      tags: [Chat]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: Contenido del mensaje.
      responses:
        '201':
          description: Mensaje enviado y guardado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /api/chats/{chatId}/read:
    put:
      summary: Marcar mensajes como leídos
      tags: [Chat]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mensajes marcados como leídos.

  /api/chats/messages/{messageId}:
    delete:
      summary: Eliminar mensaje
      description: Elimina un mensaje propio si tiene menos de 5 minutos de antigüedad (soft delete).
      tags: [Chat]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mensaje eliminado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: No eres el propietario del mensaje.
        '400':
          description: Tiempo de eliminación expirado (> 5 min).

  # --- Notificaciones ---
  /api/notifications/token:
    post:
      summary: Registrar token FCM
      description: Guarda el token de Firebase Cloud Messaging del dispositivo para recibir notificaciones push.
      tags: [Notificaciones]
      security:
        - backendAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Token FCM del dispositivo.
      responses:
        '200':
          description: Token registrado correctamente.

  # --- Reservas ---
  /api/reservations/create:
    post:
      summary: Crear nueva reserva
      tags: [Reservas]
      security:
        - backendAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tradeId:
