        **Estados permitidos (`itemState`):** `New`, `Little_used`, `Widely_used`, `Bad_condition`.
        **Precios permitidos (`pointsPrice`):** 5, 10, 25, 50.
      tags: [Publicaciones]
      security:
        - backendAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                itemState:
                  type: string
                  description: "Estado del artículo. Valores permitidos: 'New', 'Little_used', 'Widely_used', 'Bad_condition'."
                  enum:
                    - New
                    - Little_used
                    - Widely_used
                    - Bad_condition
                pointsPrice:
                  type: integer
                  description: 'Precio en puntos. Valores permitidos: 5, 10, 25, 50.'
                  enum:
                    - 5
                    - 10
                    - 25
                    - 50
                mediaUrl:
                  type: string
      responses:
        '201':
          description: Intercambio creado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Publication'
