  /api/publications/rewards/{id}/body:
    patch:
      summary: Actualizar contenido de un reward
      description: |
        Actualiza el título, descripción, contenido, precio de puntos y/o imagen de un reward.
        Todos los campos son opcionales. Solo se actualizarán los campos proporcionados.
        También permite cancelar la publicación enviando state: "Cancelled".
        **Precios permitidos (`pointsPrice`):** 500, 1000, 2000, 5000.
      tags: [Publicaciones]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la publicación reward a actualizar
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Nuevo título del reward
                description:
                  type: string
                  description: Nueva descripción del reward
                content:
                  type: string
                  description: Nuevo contenido del reward
                pointsPrice:
                  type: integer
                  description: 'Nuevo precio en puntos. Valores permitidos: 500, 1000, 2000, 5000.'
                  enum:
                    - 500
                    - 1000
                    - 2000
                    - 5000
                state:
                  type: string
                  description: 'Estado de la publicación. Para cancelar: "Cancelled".'
                  enum:
                    - Cancelled
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                content:
                  type: string
                pointsPrice:
                  type: integer
                  enum:
                    - 500
                    - 1000
                    - 2000
                    - 5000
                image:
                  type: string
                  format: binary
                  description: Nueva imagen del reward (reemplaza la anterior)
      responses:
        '200':
          description: Reward actualizado exitosamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Publication'
        '400':
          description: Datos inválidos (precio de puntos fuera del rango permitido o no es un reward).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - INVALID_POINTS_PRICE
        '403':
          description: No tienes permiso para editar esta publicación (solo institución creadora).
        '404':
          description: Publicación no encontrada.

  /api/publications/rewards/{id}:
    get:
      summary: Obtener detalle de un reward
      description: Obtiene el detalle de un Reward específico por su ID.
      tags: [Publicaciones]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del reward.
          content:
            application/json:
