    get:
      summary: Obtener historial de mensajes
      tags: [Chat]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
          description: Número de mensajes a recuperar.
        - in: query
          name: before
          schema:
            type: string
            format: uuid
          description: ID del mensaje cursor para paginación (traer mensajes anteriores a este).
      responses:
        '200':
          description: Historial de mensajes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    post:
      summary: Enviar mensaje
      tags: [Chat]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: Contenido del mensaje (opcional si se envía media).
                media:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: Lista de URLs de imágenes adjuntas.
      responses:
        '201':
          description: Mensaje enviado y guardado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

