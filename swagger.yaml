                  format: uuid
      responses:
        '201':
          description: Reserva creada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Reservation'

  /api/reservations/{reservationId}:
    get:
      summary: Obtener detalle de reserva
      tags: [Reservas]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: reservationId
          required: true
