openapi: 3.0.0
info:
  title: PESkaos API
  description: API para la aplicación EcoMap.
  version: 1.0.0
  contact:
    name: Equipo Backend PESkaos
servers:
  - url: http://localhost:3001
    description: Servidor de desarrollo local
  - url: https://peskaos-back-production.up.railway.app
    description: Servidor publico

components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de identidad obtenido directamente de Firebase (usar solo en /sync).
    backendAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT generado por este backend tras la sincronización.
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Clave de API para servicios externos.

  schemas:
    # Basado en el modelo 'registered_user' y 'client' de Prisma
    UserProfile:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        surname:
          type: string
        username:
          type: string
        dni:
          type: string
        profile_picture:
          type: string
          nullable: true
        app_language:
          type: string
          enum:
            - ca
            - es
            - en
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - client
            - admin
            - institution
            - partner
        points:
          type: integer
        streak:
          type: integer
        valorations_score:
          type: number
          format: float
          description: Puntuación media de valoraciones (0-10)

    # Basado en el modelo 'recycling_point' de Prisma
    RecyclingPoint:
      type: object
      properties:
        recycling_point_id:
          type: string
          format: uuid
        api_id:
          type: integer
        api_location:
          type: string
          enum:
            - Navarra
            - Barcelona
        name:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        equipment_type:
          type: string
          description: Mapeado desde el enum equipment_type de la BD
          enum:
            - Recycling_center
            - Batteries
            - Medicines_and_packaging
            - Garden_waste
            - Clothing_and_footwear
            - Bulky_waste
            - Glass_containers
            - Coffee_capsules
            - Used_cooking_oil
            - Household_construction_waste
            - Community_composting
        distance_km:
          type: number
          description: Distancia en KM desde el punto de búsqueda. **Solo presente** si se aplica el filtro de proximidad (lat+lng+radius).
        timetable:
          type: array
          items:
            type: object
            properties:
              open_time:
                type: string
              end_time:
                type: string

    # Respuesta estándar de la API
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        code:
          type: string
          description: Código de error interno (ej. USER_NOT_FOUND)

    PublicationMedia:
      type: object
      properties:
        media_id:
          type: string
          format: uuid
        media_url:
          type: string
        publication_id:
          type: string
          format: uuid

    DetectionItem:
      type: object
      properties:
        class:
          type: integer
        class_name:
          type: string
        confidence:
          type: number
          format: float
        bbox:
          type: array
          items:
            type: number
            format: float

    BikeDetectionResponse:
      type: object
      properties:
        hasBike:
          type: boolean
        confidence:
          type: number
          format: float
          nullable: true
        count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/DetectionItem'

    WasteDetectionResponse:
      type: object
      properties:
        hasWaste:
          type: boolean
        confidence:
          type: number
          format: float
          nullable: true
        count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/DetectionItem'

    TradeDetails:
      type: object
      properties:
        trade_id:
          type: string
          format: uuid
        publication_id:
          type: string
          format: uuid
        item_state:
          type: string
          enum:
            - New
            - Little_used
            - Widely_used
            - Bad_condition
        points_price:
          type: integer
          enum:
            - 5
            - 10
            - 25
            - 50
        created_at:
          type: string
          format: date-time

    RewardDetails:
      type: object
      properties:
        publication_id:
          type: string
          format: uuid
        content:
          type: string
        points_price:
          type: integer
          enum:
            - 500
            - 1000
            - 2000
            - 5000
        available:
          type: boolean

    Publication:
      type: object
      properties:
        publication_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
        publication_state:
          type: string
          enum:
            - Pending
            - Completed
            - Cancelled
        client_id:
          type: string
          nullable: true
        institution_id:
          type: string
          nullable: true
        trade:
          $ref: '#/components/schemas/TradeDetails'
          nullable: true
        reward:
          $ref: '#/components/schemas/RewardDetails'
          nullable: true
        publication_media:
          type: array
          items:
            $ref: '#/components/schemas/PublicationMedia'

    # --- Chat Schemas ---
    Chat:
      type: object
      properties:
        chat_id:
          type: string
          format: uuid
        other_user:
          type: object
          properties:
            name:
              type: string
            surname:
              type: string
            profile_picture:
              type: string
        last_message:
          type: object
          properties:
            content:
              type: string
            created_at:
              type: string
              format: date-time
            has_media:
              type: boolean
        unread_count:
          type: integer
        updated_at:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid
        sender_id:
          type: string
          description: ID del usuario que envió el mensaje
        content:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - SENT
            - DELIVERED
            - READ
            - FAILED
          description: Estado actual del mensaje
        created_at:
          type: string
          format: date-time
        is_deleted:
          type: boolean
        retry_count:
          type: integer
          description: Número de reintentos de envío
        last_error:
          type: string
          nullable: true
          description: Último error al enviar (si falló)
        media:
          type: array
          items:
            type: string
            format: uri

    MessageStatus:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - SENT
            - DELIVERED
            - READ
            - FAILED
        retry_count:
          type: integer
        last_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    QueueStats:
      type: object
      properties:
        queueSize:
          type: integer
          description: Número de mensajes en cola de reintentos
        messages:
          type: array
          items:
            type: object
            properties:
              messageId:
                type: string
                format: uuid
              chatId:
                type: string
                format: uuid
              retryCount:
                type: integer
              addedAt:
                type: integer
                format: int64
                description: Timestamp de cuándo se agregó a la cola
              nextRetryAt:
                type: integer
                format: int64
                description: Timestamp del próximo reintento

    # --- Reservation Schemas ---
    Reservation:
      type: object
      properties:
        reservation_id:
          type: string
          format: uuid
        trade_id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        reservation_date:
          type: string
          format: date-time
        confirmed:
          type: boolean
        trade:
          $ref: '#/components/schemas/TradeDetails'
        client:
          $ref: '#/components/schemas/UserProfile'

    ReservationEnded:
      type: object
      properties:
        reservation_id:
          type: string
          format: uuid
        ended_at:
          type: string
          format: date-time
        reservation:
          $ref: '#/components/schemas/Reservation'

    Valoration:
      type: object
      properties:
        valoration_id:
          type: string
          format: uuid
        score:
          type: integer
          minimum: 0
          maximum: 10
        comment:
          type: string
        author:
          $ref: '#/components/schemas/UserProfile'

    # --- Gamification Schemas ---
    PointHistory:
      type: object
      properties:
        history_id:
          type: string
          format: uuid
        amount:
          type: integer
          description: Cantidad de puntos (positivo = ganancia, negativo = gasto)
        source:
          type: string
          enum:
            - ECO_TRADER_SALE
            - RECYCLING_ACTION
            - EVENT_ATTENDANCE
            - REWARD_REDEMPTION
            - ADMIN_ADJUSTMENT
        description:
          type: string
        created_at:
          type: string
          format: date-time

    GamificationProfile:
      type: object
      properties:
        balance:
          type: integer
          description: Saldo actual de puntos
        limit:
          type: integer
          description: Límite máximo de puntos permitidos
        rules:
          type: object
          description: Reglas de puntos vigentes (acciones y valores permitidos)
        history:
          type: array
          items:
            $ref: '#/components/schemas/PointHistory'

    # --- User Report Schema ---
    UserReport:
      type: object
      properties:
        report_id:
          type: string
          format: uuid
        reporter_id:
          type: string
          format: uuid
        reported_user_id:
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - inappropriate_content
            - harassment
            - fake_profile
            - spam
            - other
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - Pending
            - Resolved
            - Dismissed
        created_at:
          type: string
          format: date-time
        reporter:
          type: object
          properties:
            username:
              type: string
            email:
              type: string
        reported_user:
          type: object
          properties:
            user_id:
              type: string
              format: uuid
            username:
              type: string
            email:
              type: string
            profile_picture:
              type: string
              nullable: true

    # --- Recycling Guide Schema ---
    RecyclingGuideItem:
      type: object
      properties:
        item_id:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre del producto (ej. "Botella de plástico")
        keywords:
          type: array
          items:
            type: string
          description: Palabras clave para búsqueda
        container_type:
          type: string
          enum:
            - ElectricContainer
            - GlassContainer
            - OrganicContainer
            - PaperContainer
            - PlasticContainer
            - TextileContainer
            - Unrecyclable
          description: Tipo de contenedor donde debe reciclarse
        description:
          type: string
          nullable: true
          description: Descripción adicional del producto
        created_at:
          type: string
          format: date-time

paths:
  # --- Health Check ---
  /:
    get:
      summary: Verificar estado del servidor
      tags: [General]
      responses:
        '200':
          description: API running
          content:
            text/plain:
              schema:
                type: string
                example: API running.

  # --- Usuarios ---
  /api/users/sync:
    post:
      summary: Sincronizar usuario / Login / Registro
      description: |
        Intercambia un token de Firebase por un JWT del Backend y crea el usuario si no existe.
        **Para crear un usuario con un rol específico (admin/institution/partner), se debe enviar el header `x-role-secret` con la clave correspondiente.**
      tags: [Usuarios]
      security:
        - firebaseAuth: []
      parameters:
        - in: header
          name: x-role-secret
          schema:
            type: string
          description: 'Clave secreta para autorizar el registro de roles privilegiados (admin, institution, partner).'
          required: false
      requestBody:
        description: Datos opcionales para registro manual.
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                username:
                  type: string
                role:
                  type: string
                  description: "Rol deseado. Valores: 'client', 'admin', 'institution', 'partner'. Si es distinto a 'client', requiere header `x-role-secret`."
                  enum:
                    - client
                    - admin
                    - institution
                    - partner
      responses:
        '200':
          description: Login correcto o usuario creado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      jwt:
                        type: string
                        description: JWT del Backend para futuras peticiones.
                      expiryDate:
                        type: string
                        format: date-time
                      role:
                        type: string
                        description: Rol asignado al usuario.
        '403':
          description: Clave secreta requerida o incorrecta para el rol solicitado.

  /api/users/me:
    get:
      summary: Obtener perfil del usuario actual
      tags: [Usuarios]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Perfil obtenido correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
    put:
      summary: Actualizar perfil del usuario
      tags: [Usuarios]
      security:
        - backendAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                surname:
                  type: string
                username:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                  example: '+34 612345678'
                birth_date:
                  type: string
                  format: date
                  example: '1990-01-01'
                description:
                  type: string
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
    delete:
      summary: Eliminar cuenta de usuario
      description: Requiere autenticación reciente (< 5 min).
      tags: [Usuarios]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Cuenta eliminada.

  /api/users/logout:
    post:
      summary: Cerrar sesión
      description: Invalida el JWT del backend en la base de datos.
      tags: [Usuarios]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Sesión cerrada correctamente.

  /api/users/language:
    put:
      summary: Cambiar idioma de la aplicación
      tags: [Usuarios]
      security:
        - backendAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newLanguage:
                  type: string
                  description: "Nuevo idioma para la aplicación. Valores permitidos: 'ca', 'es', 'en'."
                  enum:
                    - ca
                    - es
                    - en
      responses:
        '200':
          description: Idioma actualizado.

  # --- Endpoints de Información de Usuarios (IDs, Tipos, etc.) ---
  /api/users/ids/all:
    get:
      summary: Obtener todos los IDs de usuarios
      tags: [Usuarios - Admin/Info]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Lista de todos los IDs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  ids:
                    type: array
                    items:
                      type: string
                      format: uuid

  /api/users/ids/clients:
    get:
      summary: Obtener IDs de clientes
      tags: [Usuarios - Admin/Info]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Lista de IDs de clientes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  ids:
                    type: array
                    items:
                      type: string

  /api/users/ids/institutions:
    get:
      summary: Obtener IDs de instituciones
      tags: [Usuarios - Admin/Info]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Lista de IDs de instituciones.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  ids:
                    type: array
                    items:
                      type: string

  /api/users/ids/admins:
    get:
      summary: Obtener IDs de administradores
      tags: [Usuarios - Admin/Info]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Lista de IDs de administradores.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  ids:
                    type: array
                    items:
                      type: string

  /api/users/{id}:
    get:
      summary: Obtener perfil público de usuario por ID
      tags: [Usuarios]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Información del usuario.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'

  /api/users/{id}/type:
    get:
      summary: Obtener tipo/rol de un usuario específico
      tags: [Usuarios - Admin/Info]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rol del usuario.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  role:
                    type: string
                    enum: [client, admin, institution, partner, unknown]

  /api/users/{id}/public:
    get:
      summary: Obtener datos explícitamente públicos
      tags: [Usuarios]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Datos públicos del usuario.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'

  /api/users/{id}/private:
    get:
      summary: Obtener datos privados (Solo Admin o Propio usuario)
      tags: [Usuarios]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Datos sensibles (email, dni, teléfono, etc.).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          email:
                            type: string
                          dni:
                            type: string
                          phone:
                            type: string
                          address:
                            type: string
                          birth_date:
                            type: string

  /api/users/{id}/valorations/made:
    get:
      summary: Obtener valoraciones hechas por el usuario
      tags: [Usuarios - Valoraciones]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de valoraciones escritas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Valoration'

  /api/users/{id}/valorations/received:
    get:
      summary: Obtener valoraciones recibidas por el usuario
      tags: [Usuarios - Valoraciones]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de valoraciones recibidas y puntuación media.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  average_score:
                    type: number
                    format: float
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Valoration'

  /api/users/{id}/score:
    get:
      summary: Obtener puntuación media de un usuario
      tags: [Usuarios - Valoraciones]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Puntuación media.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  score:
                    type: number
                    format: float

  /api/users/me/rewards_bought:
    get:
      summary: Obtener rewards comprados por el usuario actual
      description: Obtiene el historial de rewards que ha comprado el usuario autenticado.
      tags: [Usuarios - Rewards]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Lista de rewards comprados.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          description: Información del reward comprado con detalles de la compra

  /api/users/{userId}/rewards_bought:
    get:
      summary: Obtener rewards comprados por un usuario específico
      description: Obtiene el historial de rewards comprados por un usuario por su ID.
      tags: [Usuarios - Rewards]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de rewards comprados por el usuario.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          description: Información del reward comprado con detalles de la compra

  /api/users/{userId}/points:
    get:
      summary: Obtener puntos de un usuario
      description: Devuelve la cantidad de EcoPoints de un cliente específico.
      tags: [Usuarios - Gamificación]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cantidad de puntos del usuario.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          points:
                            type: integer
                            description: Cantidad actual de EcoPoints del usuario

  # --- Reportes de Usuarios ---
  /api/users/report/{userId}:
    post:
      summary: Reportar a un usuario
      description: |
        Permite a un usuario autenticado reportar a otro usuario por comportamiento inapropiado.

        **Tipos de reporte disponibles (report_reason_type):**
        - `inappropriate_content` - Contenido inapropiado
        - `harassment` - Acoso
        - `fake_profile` - Perfil falso
        - `spam` - Spam
        - `other` - Otro (requiere descripción obligatoria)
      tags: [Usuarios - Reportes]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: ID del usuario a reportar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum:
                    - inappropriate_content
                    - harassment
                    - fake_profile
                    - spam
                    - other
                  description: Motivo del reporte
                description:
                  type: string
                  description: Descripción adicional (obligatoria si reason es "other")
      responses:
        '201':
          description: Usuario reportado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserReport'
        '400':
          description: Motivo inválido o falta descripción para "other".
        '404':
          description: Usuario a reportar no encontrado.

  /api/users/admin/reports:
    get:
      summary: Obtener todos los reportes (Solo Administradores)
      description: Recupera todos los reportes de usuarios. Solo accesible para administradores.
      tags: [Usuarios - Reportes]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Lista de todos los reportes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserReport'
        '403':
          description: Acceso denegado. Solo administradores.

  /api/users/admin/reports/{reportId}:
    patch:
      summary: Actualizar estado de un reporte (Solo Administradores)
      description: |
        Permite a los administradores cambiar el estado de un reporte.

        **Estados de reporte disponibles (report_status):**
        - `Pending` - Pendiente de revisión
        - `Resolved` - Resuelto (acción tomada)
        - `Dismissed` - Descartado (sin acción necesaria)
      tags: [Usuarios - Reportes]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: reportId
          required: true
          schema:
            type: string
          description: ID del reporte a actualizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - Pending
                    - Resolved
                    - Dismissed
                  description: Nuevo estado del reporte
      responses:
        '200':
          description: Estado del reporte actualizado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserReport'
        '400':
          description: Estado inválido.
        '403':
          description: Acceso denegado. Solo administradores.
        '404':
          description: Reporte no encontrado.
        '409':
          description: El nuevo estado debe ser diferente al actual.

    delete:
      summary: Eliminar un reporte (Solo Administradores)
      description: Permite a los administradores eliminar un reporte específico.
      tags: [Usuarios - Reportes]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: reportId
          required: true
          schema:
            type: string
          description: ID del reporte a eliminar
      responses:
        '200':
          description: Reporte eliminado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Acceso denegado. Solo administradores.
        '404':
          description: Reporte no encontrado.

  /api/users/admin/reports/status/{status}:
    get:
      summary: Obtener reportes filtrados por estado (Solo Administradores)
      description: Recupera todos los reportes que coinciden con el estado especificado.
      tags: [Usuarios - Reportes]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: status
          required: true
          schema:
            type: string
            enum:
              - Pending
              - Resolved
              - Dismissed
          description: Estado de los reportes a filtrar (case-insensitive)
      responses:
        '200':
          description: Lista de reportes con el estado especificado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                    description: Estado filtrado (normalizado)
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserReport'
        '400':
          description: Estado inválido.
        '403':
          description: Acceso denegado. Solo administradores.

  /api/users/admin/reports/detail/{reportId}:
    get:
      summary: Obtener detalle completo de un reporte (Solo Administradores)
      description: Recupera toda la información de un reporte específico, incluyendo detalles del reportador y usuario reportado.
      tags: [Usuarios - Reportes]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: reportId
          required: true
          schema:
            type: string
          description: ID del reporte a consultar
      responses:
        '200':
          description: Detalle completo del reporte.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserReport'
        '403':
          description: Acceso denegado. Solo administradores.
        '404':
          description: Reporte no encontrado.

  /api/users/block/{userId}:
    post:
      summary: Bloquear a un usuario
      description: >-
        Añade el ID de un usuario a la lista de bloqueados del usuario autenticado. 
        Esto impedirá ver sus publicaciones (trades) y recibir mensajes de chat de él.
      tags: [Usuarios - Block]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: userId
          schema:
            type: string
          required: true
          description: ID del usuario objetivo a bloquear
      responses:
        '200':
          description: Usuario bloqueado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Error de validación (ej. intentar bloquearse a sí mismo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: El usuario a bloquear no existe en la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '409':
          description: Conflicto - El usuario ya se encuentra en la lista de bloqueados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/users/admin/block/{userId}:
    get:
      summary: Obtener lista de bloqueados de un usuario (Admin)
      description: >-
        Devuelve el array de identificadores (IDs) de los usuarios que han sido
        bloqueados por el usuario especificado en el parámetro.
        Requiere permisos de administrador.
      tags: [Usuarios - Block]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: userId
          schema:
            type: string
          required: true
          description: ID del usuario del cual se quiere consultar la lista de bloqueos.
      responses:
        '200':
          description: Lista obtenida correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      blocked_users:
                        type: array
                        items:
                          type: string
                        description: Lista de IDs de usuarios bloqueados.
        '403':
          description: No autorizado (El usuario no es administrador).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: El usuario especificado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # --- Puntos de Reciclaje ---
  /api/recycling-points/{region}:
    get:
      summary: Obtener puntos de reciclaje por región
      description: Soporta filtros por proximidad, tipo, horario, etc. Usa cache SWR.
      tags: [Puntos de Reciclaje]
      parameters:
        - in: path
          name: region
          required: true
          schema:
            type: string
            enum:
              - navarra
              - barcelona
        # Filtros extraídos de recycling-points.controller.js
        - in: query
          name: api_id
          schema:
            type: integer
          description: Filtrar por ID original de la API externa.
        - in: query
          name: equipment_type
          schema:
            type: string
            # Enum extraído de schema.prisma y equipment-type-mapper.js
            enum:
              - Recycling_center
              - Batteries
              - Medicines_and_packaging
              - Garden_waste
              - Clothing_and_footwear
              - Bulky_waste
              - Glass_containers
              - Coffee_capsules
              - Used_cooking_oil
              - Household_construction_waste
              - Community_composting
        - in: query
          name: wasteType
          schema:
            type: string
            enum:
              - ElectricContainer
              - GlassContainer
              - OrganicContainer
              - PaperContainer
              - PlasticContainer
              - TextileContainer
              - Unrecyclable
          description: Filtra puntos que tengan contenedores de este tipo.
        - in: query
          name: name
          schema:
            type: string
          description: Búsqueda parcial por nombre.

        # --- FILTROS DE PROXIMIDAD (INTERDEPENDIENTES) ---
        - in: query
          name: lat
          schema:
            type: number
            format: float
          description: 'Latitud del centro de búsqueda. **Requerido para filtro de proximidad** (debe usarse junto con `lng` y `radius`). Si falta alguno de los tres, se ignora este filtro.'
        - in: query
          name: lng
          schema:
            type: number
            format: float
          description: 'Longitud del centro de búsqueda. **Requerido para filtro de proximidad** (debe usarse junto con `lat` y `radius`). Si falta alguno de los tres, se ignora este filtro.'
        - in: query
          name: radius
          schema:
            type: number
            format: float
          description: 'Radio en kilómetros. **Requerido para filtro de proximidad** (debe usarse junto con `lat` y `lng`). Si falta alguno de los tres, se ignora este filtro.'
        # -----------------------------------------------

        - in: query
          name: isOpenNow
          schema:
            type: boolean
          description: Filtrar solo puntos abiertos ahora mismo.
        - in: query
          name: openAt
          schema:
            type: string
            format: date-time
          description: Filtrar puntos abiertos en una fecha específica.
      responses:
        '200':
          description: Lista de puntos de reciclaje.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  totalRegisters:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecyclingPoint'

  /api/recycling-points/{region}/status:
    get:
      summary: Estado del cache (Solo Admin)
      tags: [Puntos de Reciclaje]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: region
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Metadata del cache.

  /api/recycling-points/{region}/refresh:
    post:
      summary: Forzar sincronización (Solo Admin)
      tags: [Puntos de Reciclaje]
      security:
        - backendAuth: []
      parameters:
        - in: path
          name: region
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sincronización completada.
        '409':
          description: Sincronización ya en progreso.

  # --- Rutas ---
  /api/routes:
    get:
      summary: Calcular ruta (OpenRouteService)
      tags: [Rutas]
      parameters:
        - in: query
          name: start
          required: true
          schema:
            type: string
            example: '41.3851,2.1734'
          description: Latitud,Longitud de inicio.
        - in: query
          name: end
          required: true
          schema:
            type: string
            example: '41.4036,2.1744'
          description: Latitud,Longitud de destino.
        - in: query
          name: profile
          schema:
            type: string
            default: driving-car
            enum:
              - driving-car
              - cycling-regular
              - foot-walking
              - wheelchair
      responses:
        '200':
          description: Datos de la ruta calculada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      distance:
                        type: number
                      duration:
                        type: number
                      geometry:
                        type: array
                        items:
                          type: array # [lng, lat]
                      steps:
                        type: array
                        items:
                          type: object

  # --- Gamificación (EcoPoints) ---
  /api/gamification/me:
    get:
      summary: Obtener perfil de gamificación (Puntos e Historial)
      tags: [Gamificación]
      security:
        - backendAuth: []
      responses:
        '200':
          description: Perfil de gamificación recuperado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GamificationProfile'

  /api/gamification/grant:
    post:
      summary: Otorgar puntos manualmente (Admin/Institución)
      description: |
        Permite otorgar puntos manualmente a un usuario.
        **Fuentes permitidas (`source`):**
        - `RECYCLING_ACTION`: Acción de reciclaje.
        - `EVENT_ATTENDANCE`: Asistencia a evento.
        - `ADMIN_ADJUSTMENT`: Ajuste administrativo.
      tags: [Gamificación]
      security:
        - backendAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetUserId:
                  type: string
                  format: uuid
                amount:
                  type: integer
                source:
                  type: string
                  description: "Fuente de los puntos. Valores permitidos: 'RECYCLING_ACTION', 'EVENT_ATTENDANCE', 'ADMIN_ADJUSTMENT'."
                  enum:
                    - RECYCLING_ACTION
                    - EVENT_ATTENDANCE
                    - ADMIN_ADJUSTMENT
                description:
                  type: string
      responses:
        '200':
          description: Puntos otorgados.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object # Resultado del processPoints

